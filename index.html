
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Продолжить</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =====================================
       ДИЗАЙН ДЛЯ ПК
    ===================================== */

    body.desktop {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #26334a;
      background:
        radial-gradient(
          ellipse at 15% 15%,
          #e8f4ff 0,
          transparent 42%
        ),
        radial-gradient(
          ellipse at 90% 85%,
          #fceefa 0,
          transparent 40%
        ),
        #ffffff;
    }

    .container {
      width: 100%;
      max-width: 410px;
      text-align: center;
    }

    body.desktop .container {
      padding: 28px 26px;
      background: rgba(255,255,255,.96);
      border: 1px solid #edf0f7;
      border-radius: 26px;
      box-shadow:
        0 18px 60px rgba(45,65,100,.09);
    }

    .photo {
      display: none;
    }

    body.desktop .photo {
      display: block;
      width: 100%;
      height: 235px;
      object-fit: cover;
      border-radius: 19px;
      margin-bottom: 25px;
      background: #f1f5fb;
    }

    .label, h1, .description, .footer {
      display: none;
    }

    body.desktop .label {
      display: inline-block;
      padding: 8px 13px;
      margin-bottom: 15px;
      border-radius: 30px;
      background: #edf6ff;
      color: #278bd0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    body.desktop h1 {
      display: block;
      margin: 0 0 13px;
      font-size: clamp(27px, 5vw, 34px);
      line-height: 1.2;
      letter-spacing: -.8px;
      color: #202b40;
    }

    body.desktop .description {
      display: block;
      max-width: 310px;
      margin: 0 auto 25px;
      color: #788399;
      font-size: 15px;
      line-height: 1.7;
    }

    /* =====================================
       КНОПКА ПРОДОЛЖИТЬ
    ===================================== */

    .continue-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 16px 20px;
      border: none;
      border-radius: 15px;
      background: #229ed9;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: default;
      transition:
        background .2s ease,
        transform .2s ease;
    }

    .continue-button:active {
      background: #1887bd;
      transform: scale(.98);
    }

    .continue-button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    body.desktop .continue-button {
      animation:
        pulse 1.8s ease-in-out infinite;
      box-shadow:
        0 0 0 0 rgba(34,158,217,.35);
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow:
          0 0 0 0 rgba(34,158,217,.30);
        filter: brightness(1);
      }

      50% {
        box-shadow:
          0 0 0 10px rgba(34,158,217,0);
        filter: brightness(1.06);
      }
    }

    body.desktop .footer {
      display: block;
      margin-top: 21px;
      color: #a0a9b9;
      font-size: 12px;
    }

    /* =====================================
       ПОДСКАЗКИ
    ===================================== */

    .hint {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      color: #ffffff;
      text-shadow:
        0 1px 4px rgba(0,0,0,.8);
    }

    /* =====================================
       МОБИЛЬНЫЙ ДИЗАЙН
    ===================================== */

    body.mobile {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #ffffff;

      background:
        linear-gradient(
          rgba(0,0,0,.35),
          rgba(0,0,0,.55)
        ),
        url("https://i.postimg.cc/76CC585T/photo-2026-10-14-23-17-26.jpg?v=2")
        center center / cover no-repeat fixed;
    }

    body.mobile .container {
      max-width: 380px;
    }

    @media (max-width: 420px) {
      body.desktop .container {
        padding: 24px 20px;
      }

      body.desktop .photo {
        height: 205px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body.desktop .continue-button {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      class="photo"
      src="https://i.postimg.cc/76CC585T/photo-2026-10-14-23-17-26.jpg?v=2"
      alt="Фото"
    >

    <div class="label">
      A little connection 💙
    </div>

    <h1>
      Let's get to know each other
    </h1>

    <p class="description">
      Иногда одно знакомство может сделать
      день намного лучше.
      Буду рада пообщаться с тобой поближе.
    </p>

    <a
      id="continueLink"
      class="continue-button"
      href="https://stripw.top/click?o=73&amp;a=6549&amp;sub_id1=test"
      rel="sponsored"
    >
      Продолжить
    </a>

    <div id="hint" class="hint"></div>

    <div class="footer">
      Made with love ♡
    </div>

  </main>


  <script>
    (() => {

      /* =====================================
         ГЛАВНАЯ ПАРТНЁРСКАЯ ССЫЛКА
      ===================================== */

      const targetUrl =
        "https://stripw.top/click?o=73&a=6549&sub_id1=test";


      /* =====================================
         ЭЛЕМЕНТЫ СТРАНИЦЫ
      ===================================== */

      const ua = navigator.userAgent || "";

      const link =
        document.getElementById("continueLink");

      const hint =
        document.getElementById("hint");

      link.href = targetUrl;


      /* =====================================
         ОПРЕДЕЛЕНИЕ УСТРОЙСТВА
      ===================================== */

      const isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (
          navigator.platform === "MacIntel" &&
          navigator.maxTouchPoints > 1
        );

      const isAndroid =
        /Android/i.test(ua);

      const isMobile =
        isIOS || isAndroid;


      /* =====================================
         ОПРЕДЕЛЕНИЕ ВСТРОЕННОГО БРАУЗЕРА
      ===================================== */

      const isInApp =
        /TikTok|musical_ly|musically|Bytedance|Aweme|Instagram|FBAN|FBAV|FB_IAB|Line\/|Twitter|Snapchat|;\s?wv\)/i.test(ua);


      /* =====================================
         ОПРЕДЕЛЕНИЕ ЯЗЫКА
      ===================================== */

      const en =
        (navigator.language || "ru")
          .toLowerCase()
          .startsWith("en");


      /* =====================================
         ПК

         АВТОМАТИЧЕСКИЙ ПЕРЕХОД
      ===================================== */

      if (!isMobile) {

        document.body.classList.add("desktop");

        window.location.replace(targetUrl);

        return;
      }


      /* =====================================
         МОБИЛЬНЫЙ ДИЗАЙН
      ===================================== */

      document.body.classList.add("mobile");


      /* =====================================
         ВНЕШНИЙ БРАУЗЕР

         CHROME / SAFARI / ДРУГИЕ

         АВТОМАТИЧЕСКИЙ ПЕРЕХОД
      ===================================== */

      if (!isInApp) {

        window.location.replace(targetUrl);

        return;
      }


      /* =====================================
         ANDROID ВНУТРИ TIKTOK

         ПОПЫТКА ОТКРЫТЬ GOOGLE CHROME
      ===================================== */

      if (isAndroid) {

        const parsedUrl = new URL(targetUrl);

        // Android Intent для Chrome
        const chromeIntent =
          "intent://" +
          parsedUrl.host +
          parsedUrl.pathname +
          parsedUrl.search +
          "#Intent;" +
          "scheme=https;" +
          "action=android.intent.action.VIEW;" +
          "package=com.android.chrome;" +
          "S.browser_fallback_url=" +
          encodeURIComponent(targetUrl) +
          ";end";

        // Кнопка пытается открыть Chrome
        link.href = chromeIntent;

        // Подсказка, если браузер блокирует Intent
        hint.textContent = en
          ? 'If Chrome does not open, tap ⋮ and choose "Open in Browser".'
          : 'Если Chrome не открылся, нажми ⋮ и выбери «Открыть в браузере».';

        return;
      }


      /* =====================================
         IPHONE ВНУТРИ TIKTOK

         ОБЫЧНАЯ РАБОЧАЯ ССЫЛКА
      ===================================== */

      if (isIOS) {

        link.href = targetUrl;

        hint.textContent = en
          ? 'If the link does not open, tap ⋯ and choose "Open in Browser".'
          : 'Если ссылка не открывается, нажми ⋯ и выбери «Открыть в браузере».';

        return;
      }

    })();
  </script>

</body>
</html>
